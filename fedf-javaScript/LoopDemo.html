<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Statement Demo</title>
</head>
<body>
    <h1>
        Loop Statements Demo using JS
    </h1>
    <p id="demo"></p>

    <script>
        let i=1;
        do
        {
            document.getElementById("demo").innerText+=i+"\n";
            i++;
        }while(i<=4)
    </script>
</body>
</html>
