<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Table element demo</title>
</head>
<body>
    <h1>Student Data</h1>
    <table border="2px">
        <thead>
            <caption>
                student marks report
            </caption>
            <tr>
                <th rowspan="2">sid</th>
                <th rowspan="2">sname</th>
                <th colspan="2">marks</th>
            </tr>
        </thead>
    </table>
</body>
</html>
